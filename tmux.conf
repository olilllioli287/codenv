bind r \
        source-file ~/.tmux.conf \; display "TMUX.conf reloaded!"

# General configuration.
# $ tmux show-options -g
set -g default-terminal "tmux-256color"
set -g base-index 1
set -g history-limit 10000
set -g display-time 1000
set -g repeat-time 1000
# 下方輸入框(例如幫分頁取名)用一般的按鍵:Esc 按一下就取消(原本是 vi,Esc 要先切模式,看起來像關不掉)(2026-10-14 改)
set -g status-keys emacs
set -g status-bg black
set -g status-fg white
set -g status-justify left
set -g status-interval 1
set -g status-left-length 30
set -g status-right-length 50
set -g status-left "#[fg=white,bright,bg=blue] Session #S #[default] |" # session-name
# 原本的日期時間（2026-10-04 拿掉，要恢復就刪掉下一行並取消這行註解）
# set -g status-right "#[fg=white,bg=green,bright] %a,%B.%d #[default]#[fg=black,bright,bg=cyan,bright] %H:%M:%S #[default]"
set -g status-right ""

set -g mode-keys vi

set -g visual-activity on

set -g mouse on
# Toggle mouse mode: prefix + m or F5
bind m set -g mouse \; display-message "mouse: #{?mouse,ON,OFF}"
bind -n F5 set -g mouse \; display-message "mouse: #{?mouse,ON,OFF}"

# Configuration for each window.
# $ tmux show-window-options -g
 setw -g window-status-format "[#I] #W "
 setw -g window-status-current-format "[#I] #W "
 setw -g automatic-rename off

# Customization for key bindings.
# Check it using "C-a + ?".
## Make tmux like screen, using Ctrl+A
  unbind C-b
  # Ctrl+A 不設成一般的 prefix,改成自己綁:按下時先請 ~/.codenv-ime 把輸入法切成英文,
  # 這樣注音等中文輸入法開著時,Ctrl+A 之後的字母也能傳給 tmux;指令做完會自動切回原本的輸入法
  # (沒有 ~/.codenv-ime 的話就跟一般的 Ctrl+A 一樣)(2026-10-12 改)
  set -g prefix None
  bind -n C-a run-shell -b '[ -x ~/.codenv-ime ] && ~/.codenv-ime tmux-prefix "#{client_name}" >/dev/null 2>&1; true' \; switch-client -T prefix
  # Ctrl+A 再按 a:把 Ctrl+A 傳給程式(例如 zsh 跳到行首)
  bind a send-keys C-a

## Use | and - for splitting (keeps current directory).
   unbind %
   unbind '"'
   bind | split-window -h -c "#{pane_current_path}"
   bind - split-window -v -c "#{pane_current_path}"
## Use h,j,k and l for selecting pane.
   unbind h
   unbind j
   unbind k
   unbind l
   bind h selectp -L
   bind j selectp -D
   bind k selectp -U
   bind l selectp -R

## Use ^h,^j,^k and ^l for resizing pane (repeatable).
   bind -r C-h resize-pane -L
   bind -r C-j resize-pane -D
   bind -r C-k resize-pane -U
   bind -r C-l resize-pane -R

## Use <F11> and <F12> for switching window
#   bind -n F11 select-window -t :-
#   bind -n F12 select-window -t :+
#   bind C-a selectw -p

## Use a for renaming the window prompt.
#       unbind ','
#       bind ` command-prompt -I '#W' "rename-window '%%'"

# 游標一律用直槓(程式沒有自己指定形狀時)
set -g cursor-style bar

# Cmd+←/→(iTerm 送出 Home/End)→ 轉成 Ctrl+A / Ctrl+E 交給程式,用來跳到行首/行尾
bind -n Home send-keys C-a
bind -n End send-keys C-e

# Cmd+↑/↓(Ctrl+Home/End):在 Claude 裡會跳到歷史紀錄,所以在 Claude 的 pane 停用,其他程式照常
bind -n C-Home if -F '#{==:#{pane_current_command},claude}' '' 'send-keys C-Home'
bind -n C-End  if -F '#{==:#{pane_current_command},claude}' '' 'send-keys C-End'

# Ctrl+S:只交給 vim 這類編輯器;其他格(執行結果、命令列)按下去,終端機會停止輸出、
# 看起來像當掉(要按 Ctrl+Q 才恢復),所以改成顯示中文說明(2026-10-12 加)
# Claude Code 也不給:它的 Ctrl+S 會把打到一半的訊息收起來,看起來像不見了(習慣按 Cmd+S 存檔的人很容易誤按,2026-10-13 改)
bind -n C-s if -F '#{m/r:^(n?vim?|view|nano|emacs.*)$,#{pane_current_command}}' 'send-keys C-s' 'display-message "這格不用存檔;要存程式請回到 vim 按 Ctrl+S"'

# Ctrl+Z:Windows 上用來結束輸入(例如 while (cin >> x) 的迴圈),Mac 上要按 Ctrl+D,按 Ctrl+Z 程式會一直等(2026-10-12 加)
# 在執行結果那格、程式還在跑的時候,把 Ctrl+Z 換成 Ctrl+D;其他時候照常
bind -n C-z if -F '#{@cpprun}' 'run-shell "pgrep -P #{pane_pid} >/dev/null && tmux send-keys -t #{pane_id} C-d \\; display-message \"已結束輸入(Windows 的 Ctrl+Z,在 Mac 上是 Ctrl+D)\" || tmux send-keys -t #{pane_id} C-z"' 'send-keys C-z'

# F10 執行程式的那格(vim 會標記 @cpprun):按 Esc 跳回 vim;其他格的 Esc 照常送給程式
# vim 那格已經關掉的話,拿掉標記、Esc 照常送出(原本會跳出英文的 returned 1 畫面)(2026-10-12 改)
bind -n Escape if -F '#{@cpprun}' 'run-shell "tmux select-pane -t #{@cppvim} 2>/dev/null || { tmux set -pu -t #{pane_id} @cpprun; tmux send-keys -t #{pane_id} Escape; }"' 'send-keys Escape'

# 延伸按鍵(2026-10-08):讓 Ctrl+Enter 這類組合鍵能原樣傳給程式(Claude Code 的「立刻送出」要用)
# 不要的話刪掉下面兩行,再 prefix+r 重新載入;備份在 ~/.tmux.conf.bak-2026-10-08
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ===== 中文輸入法(注音等)開著也能用(2026-10-12 加) =====
# 輸入法開著時,Ctrl+A 之後按的字母、符號會先被輸入法拿去組字,tmux 收不到;
# Ctrl 組合鍵、方向鍵、Enter、Esc、滑鼠不會被攔,所以改用這些:
#   Ctrl+A 再按一次 Ctrl+A → 叫出中文選單,用 ↑↓ 選、Enter 執行(也可以用滑鼠點),Esc 關掉
#   (選單是用鍵盤叫出來的,tmux 預設不收滑鼠,要加 -M 才點得到;
#    -O 讓滑鼠移出選單時不會關掉,點選單外面才關,2026-10-15 改)
#   Ctrl+A 再按方向鍵       → 移到上下左右那格(tmux 本來就有)
bind C-a display-menu -O -M -T "#[align=centre] 選單(↑↓ 選或滑鼠點,Enter 執行,Esc 關掉) " -x C -y C \
  "左右分割:右邊開一格" "" { split-window -h -c "#{pane_current_path}" } \
  "上下分割:下面開一格" "" { split-window -v -c "#{pane_current_path}" } \
  "放大這格 / 還原" "" { resize-pane -Z } \
  "關掉這格" "" { confirm-before -y -p "關掉這格?(Enter 確定,Esc 取消)" kill-pane } \
  "" \
  "開新分頁" "" { new-window -c "#{pane_current_path}" } \
  "下一個分頁" "" { next-window } \
  "上一個分頁" "" { previous-window } \
  "列出所有分頁,切換過去" "" { choose-tree -Zw } \
  "幫這個分頁取名" "" { command-prompt -p "新的分頁名稱(現在是 ##W；直接按 Enter 不改):" { set -w @codenv-name "%%" ; if -F "##{!=:##{@codenv-name},}" { rename-window -- "##{@codenv-name}" } ; set -wu @codenv-name } } \
  "這個分頁往左移" "" { if -F "#{window_start_flag}" { display-message "已經是最左邊的分頁了" } { swap-window -d -t :-1 } } \
  "這個分頁往右移" "" { if -F "#{window_end_flag}" { display-message "已經是最右邊的分頁了" } { swap-window -d -t :+1 } } \
  "分頁重新編號(補上空號)" "" { move-window -r ; display-message "分頁已經重新編號成 1、2、3…" } \
  "用滑鼠排列格子(開視窗,Cmd+Ctrl+A)" "" { run-shell -b 'if [ -x ~/.codenv-board ]; then ~/.codenv-board --client "#{client_name}" >/dev/null 2>&1; else tmux display-message "還沒裝排列視窗:重新執行一次 codenv 的安裝(需要 Command Line Tools)"; fi' } \
  "模塊化排列(搬動格子、取名)…" "" { display-menu -O -M -T "#[align=centre] 模塊化排列(↑↓ 選或滑鼠點,Enter 執行,Esc 關掉) " -x C -y C \
    "把這格搬到別的分頁(接著選要去哪個分頁)" "" { choose-tree -Zw { join-pane -h -s '#{window_id}.#{pane_index}' -t "%%" } } \
    "把別的格子搬進這個分頁(接著選要搬哪一格)" "" { choose-tree -Zw { join-pane -h -s "%%" -t '#{window_id}.#{pane_index}' } } \
    "把這格拆出去,變成新的分頁" "" { if -F "#{==:#{window_panes},1}" { display-message "這個分頁只有這一格,不用拆" } { break-pane ; if -F "####{@codenv-pane-name}" { set -w pane-border-status top } } } \
    "" \
    "排成左右並排" "" { select-layout even-horizontal } \
    "排成上下堆疊" "" { select-layout even-vertical } \
    "左邊一大格,右邊幾小格" "" { select-layout main-vertical } \
    "排成方格" "" { select-layout tiled } \
    "" \
    "幫這格取名(名字顯示在這格上方)" "" { command-prompt -p "這格的名字(直接按 Enter 不改):" { set -p @codenv-new "%%" ; if -F "####{!=:####{@codenv-new},}" { set -pF @codenv-pane-name "####{@codenv-new}" ; set -w pane-border-status top } ; set -pu @codenv-new } } \
    "拿掉這格的名字" "" { set -pu @codenv-pane-name ; if -F "####{==:####{P:####{?@codenv-pane-name,1,}},}" { set -wu pane-border-status } } \
  } \
  "" \
  "關掉整個工作階段" "" { confirm-before -y -p "關掉整個工作階段 ##S?裡面 ##{session_windows} 個分頁的程式全部會關掉(Enter 確定,Esc 取消)" kill-session } \
  "" \
  "開關滑鼠功能" "" { set -g mouse ; display-message "滑鼠:#{?mouse,開,關}" }
# 「幫這個分頁取名」(2026-10-14 加):輸入框是空的,直接打新名字按 Enter;什麼都沒打就按 Enter 或按 Esc 都不改。可以打中文。
# 選單會先把指令裡的 # 展開一次,所以寫成 ##W;名字先放進 @codenv-name 再拿出來,名字裡有 # 也不會被當成特殊寫法
# 「用滑鼠排列格子」(2026-10-14 加):打開 ~/.codenv-board(codenv-board.swift 編譯的 Mac 視窗),
# 用滑鼠把格子拖到別的分頁、拆成新分頁、交換分頁位置、改名;它用 $TMUX 找到目前這個 tmux
# 「模塊化排列」(2026-10-14 加):把格子搬到別的分頁(join-pane)、拆成新分頁(break-pane)、換排列方式,
# 也可以幫格子取名。取了名的分頁會在每格上方顯示名字(pane-border-status top),沒取名的格子顯示編號。
# 這是選單裡的選單,指令會被展開兩次,所以要留到最後才展開的 # 寫成 ####
# 搬格子用 @視窗代號.格子編號 指定這一格,不用 %格子代號:選分頁的畫面會把指令裡的 %1、%2 換成你選的項目
set -g pane-border-format "#{?pane_active,#[reverse],} #{?@codenv-pane-name,#{@codenv-pane-name},#{pane_index}} #[default]"
# 格子搬進、搬出、拆開後,分頁裡還有取了名字的格子就顯示名字列,沒有就收起來
set-hook -g window-layout-changed 'if -F "#{P:#{?@codenv-pane-name,1,}}" "set -w pane-border-status top" "set -wu pane-border-status"'
# 選單的「關掉整個工作階段」或關掉最後一個分頁時,有別的工作階段就切過去,不會直接跳出 tmux(2026-10-14 加)
set -g detach-on-destroy off
# Ctrl+A x 關掉這格時,按 Enter 就能確定(原本要打 y,輸入法開著打不出來)
bind x confirm-before -y -p "關掉這格?(Enter 確定,Esc 取消)" kill-pane
# Ctrl+A & 關掉整個分頁時,一樣按 Enter 確定(原本要打 y)
bind & confirm-before -y -p "關掉整個分頁 #W?(Enter 確定,Esc 取消)" kill-window
# Ctrl+A , 幫分頁取名:跟選單裡的「幫這個分頁取名」一樣用中文提示(2026-10-14 加)
bind , command-prompt -p "新的分頁名稱(現在是 #W；直接按 Enter 不改):" { set -w @codenv-name "%%" ; if -F "#{!=:#{@codenv-name},}" { rename-window -- "#{@codenv-name}" } ; set -wu @codenv-name }

# ===== 自己的設定放這裡(2026-10-12 加) =====
# 想改成自己的習慣,寫在 ~/.tmux.conf.local;codenv 更新時只會換掉這個檔,不會動到 .local
source-file -q ~/.tmux.conf.local
